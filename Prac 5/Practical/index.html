<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>🛒 Shopping Cart Calculator</h1>

            <p>Professional Billing System</p>

        </div>

        <!-- Product Selection -->

        <div class="form-box">

            <div class="input-group">

                <label>Select Product</label>

                <select id="product" onchange="updatePrice()">

                    <option value="">Choose Product</option>

                    <option value="Laptop" data-price="55000">Laptop</option>

                    <option value="Smartphone" data-price="28000">Smartphone</option>

                    <option value="Smart TV" data-price="35000">Smart TV</option>

                    <option value="Monitor" data-price="18000">Monitor</option>

                    <option value="Printer" data-price="14000">Printer</option>

                    <option value="Keyboard" data-price="1800">Keyboard</option>

                    <option value="Mouse" data-price="850">Mouse</option>

                    <option value="Headphones" data-price="2500">Headphones</option>

                    <option value="SSD 1TB" data-price="6500">SSD 1TB</option>

                    <option value="Pendrive 64GB" data-price="700">Pendrive 64GB</option>

                    <option value="Webcam" data-price="3200">Webcam</option>

                    <option value="Gaming Chair" data-price="12000">Gaming Chair</option>

                </select>

            </div>

            <div class="input-group">

                <label>Price (₹)</label>

                <input type="number" id="price" readonly>

            </div>

            <div class="input-group">

                <label>Quantity</label>

                <input type="number" id="quantity" min="1" placeholder="Enter Quantity">
            </div>

            <div class="input-group">

                <label>&nbsp;</label>

                <button onclick="addProduct()">Add To Cart</button>

            </div>

        </div>

        <!-- Cart Table -->

        <div class="table-box">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Product</th>

                        <th>Price</th>

                        <th>Quantity</th>

                        <th>Total</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="cartTable">

                </tbody>

            </table>

        </div>

        <!-- Bottom Cards -->

        <div class="cards">

            <div class="card">

                <h2>📋 Item Summary</h2>

                <ul id="summary">

                </ul>

            </div>

            <div class="card">

                <h2>⭐ Premium Products</h2>

                <ul id="expensive">

                </ul>

            </div>

        </div>

        <!-- Bill Summary -->

        <div class="bill">

            <h2>Bill Summary</h2>

            <div id="result">

                <p>No products added.</p>

            </div>

        </div>

        <!-- Buttons -->

        <div class="bottom-buttons">

            <button class="calculate-btn" onclick="calculateBill()">

                Calculate Bill

            </button>

            <button class="clear-btn" onclick="clearCart()">

                Clear Cart

            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
