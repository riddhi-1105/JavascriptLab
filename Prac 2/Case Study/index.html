<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMart Smart Billing System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#eef4fb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:850px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,0.15);
}

.header{
    background:#003366;
    color:white;
    text-align:center;
    padding:25px;
}

.header h1{
    font-size:32px;
    margin-bottom:8px;
}

.header p{
    color:#d9ebff;
}

.form-section{
    padding:30px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#003366;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d3dce6;
    border-radius:10px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#0056b3;
    box-shadow:0 0 8px rgba(0,86,179,0.2);
}

#searchProduct{
    margin-bottom:15px;
}

.product-list{
    height:250px;
    overflow-y:auto;
    border:1px solid #d3dce6;
    border-radius:10px;
    padding:15px;
    background:#f8fbff;
}

.product-list label{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    border-radius:8px;
    margin-bottom:5px;
    cursor:pointer;
    transition:0.3s;
}

.product-list label:hover{
    background:#e9f2ff;
}

.product-list input[type="checkbox"]{
    width:18px;
    height:18px;
    accent-color:#003366;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:25px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

#generateBtn{
    background:#003366;
    color:white;
}

#generateBtn:hover{
    background:#0056b3;
}

#printBtn{
    background:#00a86b;
    color:white;
}

#printBtn:hover{
    background:#008456;
}

#clearBtn{
    background:#dc3545;
    color:white;
}

#clearBtn:hover{
    background:#b81f2d;
}

#output{
    margin-top:30px;
    background:#f8fbff;
    border-left:6px solid #003366;
    border-radius:12px;
    padding:25px;
    line-height:1.9;
}

.footer{
    background:#003366;
    color:white;
    text-align:center;
    padding:18px;
}

.footer strong{
    color:#ffeb3b;
}

@media(max-width:768px){

.row{
    grid-template-columns:1fr;
}

.buttons{
    flex-direction:column;
}

.container{
    width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>🛒 DMart Smart Billing System</h1>
    <p>Online Shopping Billing using JavaScript Data Types</p>
</div>

<div class="form-section">

<form id="billForm">

<div class="row">

<div class="form-group">
<label>Customer Name</label>
<input
type="text"
id="name"
placeholder="Enter Customer Name">
</div>

<div class="form-group">
<label>Mobile Number</label>
<input
type="tel"
id="contact"
placeholder="Enter Mobile Number">
</div>

</div>

<div class="form-group">

<label>🔍 Search Products</label>

<input
type="text"
id="searchProduct"
placeholder="Search Product..."
onkeyup="searchProducts()">

</div>

<div class="form-group">

<label>Select Products</label>

<div class="product-list" id="productList">

<label><input type="checkbox" value="Rice"> Rice</label>
<label><input type="checkbox" value="Milk"> Milk</label>
<label><input type="checkbox" value="Sugar"> Sugar</label>
<label><input type="checkbox" value="Tea Powder"> Tea Powder</label>
<label><input type="checkbox" value="Cooking Oil"> Cooking Oil</label>
<label><input type="checkbox" value="Soap"> Soap</label>
<label><input type="checkbox" value="Shampoo"> Shampoo</label>
<label><input type="checkbox" value="Biscuits"> Biscuits</label>
<label><input type="checkbox" value="Chocolate"> Chocolate</label>
<label><input type="checkbox" value="Cold Drink"> Cold Drink</label>
<label><input type="checkbox" value="Coffee"> Coffee</label>
<label><input type="checkbox" value="Bread"> Bread</label>
<label><input type="checkbox" value="Butter"> Butter</label>
<label><input type="checkbox" value="Cheese"> Cheese</label>
<label><input type="checkbox" value="Eggs"> Eggs</label>
<label><input type="checkbox" value="Salt"> Salt</label>
<label><input type="checkbox" value="Maggi"> Maggi</label>
<label><input type="checkbox" value="Toothpaste"> Toothpaste</label>
<label><input type="checkbox" value="Detergent"> Detergent</label>
<label><input type="checkbox" value="Juice"> Juice</label>

</div>

</div>

<div class="row">

<div class="form-group">
<label>Price Per Item (₹)</label>
<input
type="number"
id="price"
placeholder="Enter Price">
</div>

<div class="form-group">
<label>Quantity</label>
<input
type="number"
id="quantity"
value="1"
min="1">
</div>

</div>

<div class="row">

<div class="form-group">
<label>Discount (%)</label>
<input
type="number"
id="discount"
placeholder="Enter Discount">
</div>

<div class="form-group">
<label>Payment Method</label>
<select id="payment">
<option>Cash</option>
<option>UPI</option>
<option>Credit Card</option>
<option>Debit Card</option>
</select>
</div>

</div>

<div class="buttons">

<button
type="button"
id="generateBtn"
onclick="calculateBill()">
Generate Bill
</button>

<button
type="button"
id="printBtn"
onclick="window.print()">
Print Bill
</button>

<button
type="button"
id="clearBtn"
onclick="clearForm()">
Clear
</button>

</div>

</form>

<div id="output">

<h2 style="color:#003366;text-align:center;">
🧾 Bill Summary
</h2>

<p style="text-align:center;margin-top:10px;">
Your bill will appear here after clicking Generate Bill.
</p>

</div>

</div>

<div class="footer">
Designed by <strong>Riddhi Thakkar</strong><br>
PRN : <strong>24070521066</strong>
</div>

</div>

<script src="script1.js"></script>

</body>
</html>
