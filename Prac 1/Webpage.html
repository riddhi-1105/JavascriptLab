<!DOCTYPE html>
<html>
<head>
    <title>Riddhi's Webpage</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0310f7, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 80px;
            height: auto;
        }

        .card {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 6px 0 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #0056b3;
        }

        #output {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
        }
    </style>

<!-- Internal Javascript -->
    <script>
        function showWelcome() {
            const name = document.getElementById("name").value;
            const SEM = document.getElementById("SEM").value;
            const PRN = document.getElementById("PRN").value;
            const Contact = document.getElementById("Contact").value;
            const Age = document.getElementById("Age").value;
            const CGPA = document.getElementById("CGPA").value;
            const Address = document.getElementById("Address").value;

            document.getElementById("output").innerHTML =
                "<h2>Welcome, " + name + "!</h2>" +
                "<p><b>SEM:</b> " + SEM + "</p>" +
                "<p><b>PRN:</b> " + PRN + "</p>" +
                "<p><b>Contact:</b> " + Contact + "</p>" +
                "<p><b>Age:</b> " + Age + "</p>" +
                "<p><b>CGPA:</b> " + CGPA + "</p>" +
                "<p><b>Address:</b> " + Address + "</p>";

            console.log("User Name: " + name);
            console.info("User SEM: " + SEM);
            console.info("User Age: " + Age);
        }
    </script>
</head>

<body>
<img src="logo.jpg" alt="Logo" class="logo">
<div class="card">
<h1>Welcome to SIT Nagpur</h1>
<h2>User Information</h2>

<label>Enter Name:</label><br>
<input type="text" id="name" placeholder="Enter Name"><br>

<label>Enter SEM:</label><br>
<input type="number" id="SEM" placeholder="Enter SEM"><br>

<label>Enter PRN:</label><br>
<input type="text" id="PRN" placeholder="Enter PRN"><br>

<label>Enter Contact:</label><br>
<input type="number" id="Contact" placeholder="Enter Contact"><br>

<label>Enter Age:</label><br>
<input type="number" id="Age" placeholder="Enter Age"><br>

<label>Enter CGPA:</label><br>
<input type="text" id="CGPA" placeholder="Enter CGPA"><br>

<label>Enter Address:</label><br>
<input type="text" id="Address" placeholder="Enter Address"><br>

<!-- Inline Javascript -->
<button onclick="showWelcome(); greet();">
    Submit
</button>

<hr>

<div id="output"></div>
</div>

<script src="function.js"></script>

</body>
</html>
