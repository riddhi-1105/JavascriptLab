<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<style>
  :root {
    --bg1: #eef2ff;
    --bg2: #fdf2f8;
    --card: #ffffff;
    --accent: #6b7cff;
    --accent-soft: #eef0ff;
    --pink-soft: #fff0f6;
    --text-dark: #222833;
    --text-muted: #8a8f98;
    --border: #e3e5e9;
    --border-hover: #c7cbd3;
    --error: #e0503c;
    --success: #2fa86a;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg1) 0%, #ffffff 45%, var(--bg2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .form-container {
    background: var(--card);
    width: 100%;
    max-width: 400px;
    padding: 18px 24px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 10px 28px rgba(107, 124, 255, 0.12);
  }

  h2 {
    margin: 0 0 2px;
    text-align: center;
    color: var(--text-dark);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin: 0 0 8px;
  }

  .mandatory {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    text-align: center;
    margin: 0 0 12px;
    padding: 5px 0;
    border-radius: 6px;
    font-weight: 600;
  }

  .star {
    color: var(--error);
    font-weight: 700;
  }

  .field {
    margin-bottom: 10px;
  }

  .row-2 {
    display: flex;
    gap: 10px;
  }

  .row-2 .field {
    flex: 1;
  }

  label {
    display: block;
    margin-bottom: 3px;
    font-weight: 600;
    font-size: 11.5px;
    color: var(--text-dark);
  }

  input[type="text"],
  input[type="password"],
  input[type="email"],
  input[type="url"],
  select {
    width: 100%;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--text-dark);
    border: 1.5px solid var(--border);
    border-radius: 7px;
    outline: none;
    background: #fafbff;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    font-family: inherit;
  }

  input:hover,
  select:hover {
    border-color: var(--border-hover);
  }

  input.focused,
  select.focused {
    border-color: var(--accent) !important;
    background: #ffffff;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  input.input-error,
  select.input-error {
    border-color: var(--error) !important;
  }

  .dob-row {
    display: flex;
    gap: 8px;
  }

  .dob-row select {
    flex: 1;
  }

  .error {
    color: var(--error);
    font-size: 11px;
    margin-top: 2px;
    min-height: 12px;
    line-height: 1.3;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 6px 0 2px;
    background: var(--pink-soft);
    padding: 7px 10px;
    border-radius: 7px;
  }

  .checkbox-row input {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .checkbox-row label {
    margin: 0;
    font-weight: 400;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
  }

  button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(107, 124, 255, 0.28);
  }

  button:hover {
    background: #5866e6;
    box-shadow: 0 6px 18px rgba(107, 124, 255, 0.35);
  }

  button:active { transform: scale(0.98); }

  #successMsg {
    color: var(--success);
    text-align: center;
    margin: 8px 0 0;
    font-weight: 600;
    font-size: 12.5px;
    min-height: 14px;
  }

  @media (max-width: 480px) {
    .form-container { padding: 16px 18px 14px; }
    .row-2, .dob-row { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>

  <div class="form-container">
    <h2>Create Account</h2>
    <p class="subtitle">Fill in your details to register</p>
    <p class="mandatory"><span class="star">*</span> Mandatory to fill</p>

    <form id="regForm" novalidate>

      <div class="row-2">
        <div class="field">
          <label for="firstname">Firstname <span class="star">*</span></label>
          <input type="text" id="firstname" name="firstname">
          <div class="error" id="err-firstname"></div>
        </div>

        <div class="field">
          <label for="lastname">Lastname</label>
          <input type="text" id="lastname" name="lastname">
        </div>
      </div>

      <div class="field">
        <label>Birthday</label>
        <div class="dob-row">
          <select id="day">
            <option value="">Day</option>
          </select>
          <select id="month">
            <option value="">Month</option>
          </select>
          <select id="year">
            <option value="">Year</option>
          </select>
        </div>
        <div class="error" id="err-dob"></div>
      </div>

      <div class="field">
        <label for="username">Username <span class="star">*</span></label>
        <input type="text" id="username" name="username">
        <div class="error" id="err-username"></div>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">
        <div class="error" id="err-email"></div>
      </div>

      <div class="field">
        <label for="website">Website</label>
        <input type="url" id="website" name="website">
      </div>

      <div class="row-2">
        <div class="field">
          <label for="password">Password <span class="star">*</span></label>
          <input type="password" id="password" name="password">
          <div class="error" id="err-password"></div>
        </div>

        <div class="field">
          <label for="repassword">Re-password <span class="star">*</span></label>
          <input type="password" id="repassword" name="repassword">
          <div class="error" id="err-repassword"></div>
        </div>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the terms &amp; conditions.</label>
      </div>
      <div class="error" id="err-terms"></div>

      <button type="submit">Submit</button>
      <p id="successMsg"></p>
    </form>
  </div>

<script src="scriptcase.js"></script>
</body>
</html>
